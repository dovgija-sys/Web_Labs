<app-header></app-header>
<main class="forms-row">

  <app-potato-field-form (yieldCalculated)="setPotatoFieldYield($event)"></app-potato-field-form>

    <p>Загальний урожай (Field + PotatoField): <b>{{ sumYield }}</b></p>
  </section>
}
